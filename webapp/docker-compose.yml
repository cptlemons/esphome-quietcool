services:
  quietcool-web:
    build: .
    container_name: quietcool-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ESPHOME_HOST=${ESPHOME_HOST:-192.168.50.114}
      - ESPHOME_PORT=${ESPHOME_PORT:-6053}
      - ESPHOME_API_KEY=${ESPHOME_API_KEY:-}
      - WEB_PORT=8080
